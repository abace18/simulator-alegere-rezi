<style>
/* Layout: o coloană îngustă tip „fișă clinică”; o întrebare pe ecran; rezultatele ca o listă de opțiuni numerotată după rang. */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #12201c;
  --muted: #5a6b66;
  --line: #d3ddd9;
  --accent: #0f6b52;
  --accent-ink: #ffffff;
  --mark: #dcefe7;
  --warn: #a3412a;
  --warn-bg: #f8e9e4;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #151f1c; --ink: #e5eeeb; --muted: #95a8a1; --line: #29372f;
    --accent: #4cc59b; --accent-ink: #062019; --mark: #17372d; --warn: #e48c71; --warn-bg: #33201a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --ink: #e5eeeb; --muted: #95a8a1; --line: #29372f;
  --accent: #4cc59b; --accent-ink: #062019; --mark: #17372d; --warn: #e48c71; --warn-bg: #33201a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.55; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 6vw, 3.1rem); font-weight: 800; font-stretch: 78%; line-height: 1.02; }
h2 { font-size: 1.5rem; font-weight: 700; font-stretch: 85%; line-height: 1.15; }
h3 { font-size: 1.1rem; font-weight: 700; font-stretch: 90%; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-stretch: 85%; font-size: 1.05rem; }
.brand svg { width: 64px; height: 22px; flex: none; }
.brand svg path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen { display: grid; gap: 24px; padding-block: 32px 0; }

/* Intro */
.intro-lead { font-size: 1.1rem; max-width: 60ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.facts b { font-family: var(--font-display); font-size: 1.6rem; font-stretch: 80%; font-weight: 800; }
.facts span { font-size: 0.85rem; color: var(--muted); }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-size: 0.8rem; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; margin-top: 2px; }
.resume { padding: 14px 16px; border: 1px dashed var(--accent); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Progress */
.progress { display: grid; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

/* Question */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 22px; display: grid; gap: 24px; }
.qtext { font-family: var(--font-display); font-size: clamp(1.3rem, 4.2vw, 1.75rem); font-weight: 600; font-stretch: 88%; line-height: 1.2; text-wrap: balance; }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.likert button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 4px; display: grid; gap: 4px; justify-items: center; font-size: 0.78rem; line-height: 1.2; color: var(--muted); min-height: 76px; }
.likert button b { font-family: var(--font-mono); font-size: 1.05rem; color: var(--ink); font-weight: 500; }
.likert button:hover { border-color: var(--accent); }
.likert button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.likert button[aria-pressed="true"] b { color: var(--accent-ink); }
.qnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 0.8rem; color: var(--muted); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 0.92rem; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--mark); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip.no[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); }

/* Tiebreak */
.duel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.day { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.day:hover { border-color: var(--accent); }
.day .eyebrow { color: var(--accent); }
.day p { font-size: 0.97rem; }

/* Results */
.verdict { display: grid; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--mark); color: var(--ink); width: fit-content; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.pill.close::before { background: var(--warn); }
.opts { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; }
.opt.first { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.rank { font-family: var(--font-display); font-weight: 800; font-stretch: 75%; font-size: 2rem; line-height: 1; color: var(--accent); }
.opt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 500; }
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-block: 8px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.opt-body { display: grid; gap: 8px; min-width: 0; }
.why { display: grid; gap: 4px; font-size: 0.92rem; margin: 0; padding: 0; list-style: none; }
.why li { padding-left: 18px; position: relative; }
.why li::before { content: "+"; position: absolute; left: 0; font-family: var(--font-mono); color: var(--accent); }
.why li.minus::before { content: "−"; color: var(--warn); }
.meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
.table-wrap { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.excluded td { color: var(--muted); }
.profile { display: grid; gap: 8px; margin-top: 12px; }
.prow { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) minmax(0, 11rem); gap: 10px; align-items: center; font-size: 0.82rem; }
.prow span:last-child { text-align: right; }
.ptrack { height: 8px; background: var(--line); border-radius: 4px; position: relative; }
.ptrack i { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.toast { font-size: 0.85rem; color: var(--accent); min-height: 1.2em; }
.note { font-size: 0.9rem; color: var(--muted); display: grid; gap: 8px; border-left: 3px solid var(--line); padding-left: 14px; }
.copybox { width: 100%; font-family: var(--font-mono); font-size: 0.8rem; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }

@media (max-width: 560px) {
  .facts { grid-template-columns: 1fr; }
  .duel { grid-template-columns: 1fr; }
  .likert button { font-size: 0.68rem; padding-inline: 2px; min-height: 70px; }
  .opt { grid-template-columns: 1fr; gap: 6px; }
  .prow { grid-template-columns: 1fr 1fr; }
  .prow .ptrack { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

/* ===================== SCOR ===================== */
function profile(ans) {
  const acc = {}, cnt = {};
  DIMS.forEach(([k]) => { acc[k] = 0; cnt[k] = 0; });
  QUESTIONS.forEach((q, i) => {
    if (!ans[i]) return;
    const c = (ans[i] - 3) / 2;
    for (const [k, w] of Object.entries(q.m)) { acc[k] += c * w; cnt[k] += Math.abs(w); }
  });
  const p = {};
  DIMS.forEach(([k]) => {
    const m = cnt[k] ? Math.max(-1, Math.min(1, acc[k] / cnt[k])) : 0;
    p[k] = { pref: 2 + 2 * m, str: Math.abs(m) };
  });
  return p;
}

function scoreAll(st) {
  const p = profile(st.ans);
  const res = SPECS.map(s => {
    const ex = st.deals.filter(di => DEALS[di][1](s)).map(di => DEALS[di][2]);
    let num = 0, den = 0;
    const fits = [];
    DIMS.forEach(([k, label, lo, hi]) => {
      const { pref, str } = p[k];
      const w = 0.4 + 2 * str * str + str;
      const gap = Math.abs(pref - s.v[k]);
      num += w * (1 - gap / 4); den += w;
      if (str >= 0.4) fits.push({ k, gap, str, text: pref > 2 ? hi : lo });
    });
    let sc = num / den;
    const om = s.o.filter(o => st.organs.includes(o)).length;
    if (st.organs.length) sc += om ? Math.min(0.1, 0.045 * om) : (s.o.includes("tot") ? 0 : -0.03);
    const am = s.a.filter(a => st.acts.includes(a)).length;
    sc += Math.min(0.08, 0.03 * am);
    return { s, raw: sc, ex, om, am,
      good: fits.filter(f => f.gap <= 1 && Math.abs(s.v[f.k] - MEAN[f.k]) >= 0.9)
        .sort((a, b) => b.str * Math.abs(s.v[b.k] - MEAN[b.k]) - a.str * Math.abs(s.v[a.k] - MEAN[a.k])).slice(0, 3),
      bad: fits.filter(f => f.gap >= 2).sort((a, b) => b.gap * b.str - a.gap * a.str).slice(0, 2) };
  });
  return res;
}

function duelPairs(ranked) {
  const t = ranked.slice(0, 4).map(r => r.s.id);
  const pairs = [];
  for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) pairs.push([t[i], t[j]]);
  return pairs;
}

function rankEligible(st) {
  return scoreAll(st).filter(r => !r.ex.length).sort((a, b) => b.raw - a.raw);
}

function finalResults(st) {
  const all = scoreAll(st);
  const ok = all.filter(r => !r.ex.length).sort((a, b) => b.raw - a.raw);
  const pairs = duelPairs(ok);
  const wins = {};
  pairs.forEach(([a, b], i) => {
    const w = st.duels[i];
    if (w === 0) wins[a] = (wins[a] || 0) + 1;
    if (w === 1) wins[b] = (wins[b] || 0) + 1;
  });
  ok.forEach(r => { r.wins = wins[r.s.id] || 0; r.fin = Math.min(0.99, r.raw + 0.03 * r.wins); });
  ok.sort((a, b) => b.fin - a.fin);
  const ex = all.filter(r => r.ex.length).sort((a, b) => b.raw - a.raw);
  return { ok, ex, p: profile(st.ans), dueled: pairs.length > 0 && st.duels.length >= pairs.length };
}

/* ===================== COD DE PARTAJARE ===================== */
// Doar litere, cifre și cratime, ca să treacă prin hash.
function maskOf(list, src) { let m = 0n; list.forEach(k => { const i = src.findIndex(x => x[0] === k); if (i >= 0) m |= 1n << BigInt(i); }); return m.toString(36); }
function listOf(code, src) { let m = 0n; try { for (const ch of code) m = m * 36n + BigInt(parseInt(ch, 36)); } catch (e) { return []; } return src.filter((_, i) => (m >> BigInt(i)) & 1n).map(x => x[0]); }
function encode(st) {
  const dm = st.deals.reduce((m, i) => m | (1 << i), 0).toString(36);
  return ["r", st.ans.join(""), maskOf(st.organs, ORGANS), maskOf(st.acts, ACTS), dm, st.duels.join("") || "x"].join("-");
}
function decode(h) {
  const parts = h.split("-");
  if (parts[0] !== "r" || parts.length !== 6 || parts[1].length !== QUESTIONS.length || !/^[1-5]+$/.test(parts[1])) return null;
  const st = fresh();
  st.ans = parts[1].split("").map(Number);
  st.organs = listOf(parts[2], ORGANS);
  st.acts = listOf(parts[3], ACTS);
  const dm = parseInt(parts[4], 36) || 0;
  st.deals = DEALS.map((_, i) => i).filter(i => dm & (1 << i));
  st.duels = parts[5] === "x" ? [] : parts[5].split("").map(Number).filter(n => n === 0 || n === 1);
  st.step = "results";
  return st;
}

/* ===================== RANDARE ===================== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOTAL_STEPS = QUESTIONS.length + 3 + N_DUELS;

function progressBar(done, label) {
  const pct = Math.round(100 * done / TOTAL_STEPS);
  return `<div class="progress"><div class="progress-row"><span class="eyebrow">${esc(label)}</span><span class="mono muted">${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function render() {
  save();
  const f = { intro, q: question, organs: () => multi("organs"), acts: () => multi("acts"), deals: () => multi("deals"), duel, results }[S.step];
  app.innerHTML = f();
  bind();
  if (S.step !== "intro") window.scrollTo({ top: 0 });
}

function intro() {
  const saved = loadSaved();
  const canResume = saved && saved.step !== "intro" && saved.step !== "results";
  return `<section class="screen">
    <p class="eyebrow">Pentru absolvenți și rezidenți indeciși</p>
    <h1>Ce specialitate ți se potrivește la rezidențiat?</h1>
    <p class="intro-lead">Evaluezi ${QUESTIONS.length} afirmații despre activitatea clinică pe care ți-o dorești, alegi patologia și competențele care te atrag și ce excluzi categoric, apoi compari zile de lucru fără să vezi numele specialităților. La final primești un clasament al celor ${SPECS.length} specialități.</p>
    <div class="facts">
      <div><b class="mono">${SPECS.length}</b><span>specialități medicale evaluate</span></div>
      <div><b class="mono">${TOTAL_STEPS}</b><span>pași, cam 8 minute</span></div>
      <div><b class="mono">${DIMS.length}</b><span>dimensiuni ale profilului tău</span></div>
    </div>
    <ol class="steps">
      <li><span><b>Afirmații clinice.</b> Acordul tău cu fiecare, de la 1 la 5.</span></li>
      <li><span><b>Interese.</b> Domeniile de patologie și competențele pe care vrei să le practici.</span></li>
      <li><span><b>Criterii eliminatorii.</b> Ce nu ai face niciodată. Specialitățile care le încalcă sunt scoase din clasament, oricât de bine s-ar potrivi altfel.</span></li>
      <li><span><b>Departajare oarbă.</b> Primele patru specialități se înfruntă două câte două prin descrieri ale unei zile obișnuite, fără nume.</span></li>
    </ol>
    ${canResume ? `<div class="resume"><span>Ai un test început, la pasul ${stepIndex(saved) + 1} din ${TOTAL_STEPS}.</span><button class="btn" id="resumeBtn" type="button">Continuă de unde ai rămas</button></div>` : ""}
    <div class="actions"><button class="btn primary" id="startBtn" type="button">Începe testul</button></div>
  </section>`;
}

function stepIndex(st) {
  if (st.step === "q") return st.qi;
  if (st.step === "organs") return QUESTIONS.length;
  if (st.step === "acts") return QUESTIONS.length + 1;
  if (st.step === "deals") return QUESTIONS.length + 2;
  if (st.step === "duel") return QUESTIONS.length + 3 + st.di;
  return 0;
}

function question() {
  const q = QUESTIONS[S.qi], a = S.ans[S.qi];
  return `<section class="screen">
    ${progressBar(S.qi, `${q.sec} · ${S.qi + 1} din ${QUESTIONS.length}`)}
    <div class="qcard">
      <p class="qtext">${esc(q.t)}</p>
      <div class="likert" role="group" aria-label="Cât de mult te descrie">
        ${LIKERT.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${a == v}"><b>${v}</b>${l}</button>`).join("")}
      </div>
    </div>
    <div class="qnav">
      <button class="btn ghost" id="backBtn" type="button" ${S.qi === 0 ? "disabled" : ""}>← Înapoi</button>
      <span class="hint">Poți folosi tastele 1–5</span>
      ${a ? `<button class="btn" id="nextBtn" type="button">Mai departe →</button>` : `<span></span>`}
    </div>
  </section>`;
}

const MULTI = {
  organs: { src: ORGANS, title: "Ce patologie te-a atras cel mai mult în stagii?", sub: "Alege oricâte. Dacă nu alegi nimic, domeniul de patologie nu influențează scorul.", label: "Interese · patologie", idx: 0 },
  acts: { src: ACTS, title: "Ce competențe ai vrea să practici?", sub: "Alege oricâte. Fiecare potrivire adaugă puncte specialităților în care competența e de rutină.", label: "Interese · competențe", idx: 1 },
  deals: { src: DEALS.map((d, i) => [i, d[0]]), title: "Ce excluzi categoric din viitoarea ta specialitate?", sub: "Fiecare alegere elimină complet specialitățile care o implică. Bifează doar ce chiar nu ai accepta.", label: "Criterii eliminatorii", idx: 2, no: true },
};
function multi(kind) {
  const m = MULTI[kind], sel = S[kind];
  return `<section class="screen">
    ${progressBar(QUESTIONS.length + m.idx, m.label)}
    <div class="qcard">
      <div style="display:grid;gap:6px"><p class="qtext">${m.title}</p><p class="muted">${m.sub}</p></div>
      <div class="chips">${m.src.map(([k, l]) => `<button type="button" class="chip${m.no ? " no" : ""}" data-k="${k}" aria-pressed="${sel.includes(k)}">${esc(l)}</button>`).join("")}</div>
      ${kind === "deals" ? `<p class="mono muted" id="dealCount">${dealNote()}</p>` : ""}
    </div>
    <div class="qnav">
      <button class="btn ghost" id="backBtn" type="button">← Înapoi</button>
      <button class="btn primary" id="nextBtn" type="button">${sel.length ? "Mai departe →" : "Niciuna, mai departe →"}</button>
    </div>
  </section>`;
}
function dealNote() {
  const left = SPECS.filter(s => !S.deals.some(di => DEALS[di][1](s))).length;
  return `Rămân ${left} din ${SPECS.length} specialități.`;
}

function duel() {
  const ranked = rankEligible(S);
  const pairs = duelPairs(ranked);
  if (S.di >= pairs.length) { S.step = "results"; return results(); }
  const [a, b] = pairs[S.di].map(id => SPECS[id]);
  const flip = (S.di % 2) === 1; // alternează poziția ca să nu favorizeze stânga
  const left = flip ? b : a, right = flip ? a : b;
  return `<section class="screen">
    ${progressBar(QUESTIONS.length + 3 + S.di, `Departajare oarbă · ${S.di + 1} din ${pairs.length}`)}
    <div style="display:grid;gap:6px"><h2>Ce zi ai prefera să trăiești?</h2><p class="muted">Numele specialităților sunt ascunse. Alege după instinct.</p></div>
    <div class="duel">
      <button type="button" class="day" data-id="${left.id}"><span class="eyebrow">Ziua A</span><p>${esc(left.day)}</p></button>
      <button type="button" class="day" data-id="${right.id}"><span class="eyebrow">Ziua B</span><p>${esc(right.day)}</p></button>
    </div>
    <div class="qnav"><button class="btn ghost" id="backBtn" type="button">← Înapoi</button><span></span></div>
  </section>`;
}

function verdictOf(ok) {
  if (ok.length < 2) return ["Un singur candidat", false];
  const gap = (ok[0].fin - ok[1].fin) * 100;
  if (gap >= 4) return ["Câștigător clar", false];
  if (gap >= 1.5) return ["Avantaj moderat față de locul 2", false];
  return ["Aproape la egalitate cu locul 2", true];
}

function results() {
  const { ok, ex, p } = finalResults(S);
  if (!ok.length) return `<section class="screen"><h2>Ai eliminat toate specialitățile</h2><p>Criteriile eliminatorii alese exclud toate cele ${SPECS.length} specialități. Întoarce-te și renunță la unul dintre ele.</p><div class="actions"><button class="btn primary" id="toDeals" type="button">Modifică criteriile</button></div></section>`;
  const top = ok.slice(0, 5);
  const [vText, vClose] = verdictOf(ok);
  const code = encode(S);
  return `<section class="screen">
    <div class="verdict">
      <p class="eyebrow">Rezultatul tău</p>
      <h1>${esc(top[0].s.n)}</h1>
      <span class="pill${vClose ? " close" : ""}">${vText}</span>
      <p class="muted">${vClose ? `Primele două sunt foarte apropiate. Un stagiu sau o gardă în ambele te poate ajuta să decizi.` : `Potrivirea este calculată din profilul tău pe ${DIMS.length} dimensiuni, din interese și din departajarea oarbă.`}</p>
    </div>

    <ol class="opts">${top.map((r, i) => optCard(r, i)).join("")}</ol>

    <div class="actions">
      <button class="btn primary" id="shareBtn" type="button">Copiază link-ul rezultatului</button>
      <button class="btn" id="restartBtn" type="button">Refă testul</button>
    </div>
    <p class="toast" id="toast" aria-live="polite"></p>
    <input class="copybox" id="copybox" readonly hidden value="">

    <details>
      <summary>Profilul tău pe ${DIMS.length} dimensiuni</summary>
      <div class="profile">${DIMS.map(([k, label, lo, hi]) => `<div class="prow"><span>${esc(lo)}</span><div class="ptrack" title="${esc(label)}"><i style="left:${(p[k].pref / 4 * 100).toFixed(1)}%"></i></div><span>${esc(hi)}</span></div>`).join("")}</div>
    </details>

    <details>
      <summary>Toate specialitățile (${ok.length})</summary>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Specialitate</th><th>Potrivire</th><th>Ani</th></tr></thead>
        <tbody>${ok.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${esc(r.s.n)}</td><td class="num">${pct(r.fin)}%</td><td class="num">${r.s.y}</td></tr>`).join("")}</tbody>
      </table></div>
    </details>

    ${ex.length ? `<details>
      <summary>Eliminate de criteriile tale (${ex.length})</summary>
      <div class="table-wrap"><table class="excluded">
        <thead><tr><th>Specialitate</th><th>Motiv</th><th>Scor fără filtru</th></tr></thead>
        <tbody>${ex.map(r => `<tr><td>${esc(r.s.n)}</td><td>${esc(r.ex.join(", "))}</td><td class="num">${pct(r.raw)}%</td></tr>`).join("")}</tbody>
      </table></div>
    </details>` : ""}

    <div class="note">
      <p><b>Cât de precis e testul?</b> Nicio serie de întrebări nu poate garanta 100% că ai ales corect, pentru că preferințele tale se schimbă cu stagiile și experiența. Ce garantează simulatorul: o specialitate care încalcă un criteriu eliminatoriu ales de tine nu apare niciodată în clasament, iar fiecare scor e explicat prin dimensiunile tale.</p>
      <p>Durata rezidențiatului este orientativă. Verifică durata oficială și numărul de locuri pe rezidentiat.ms.ro înainte de alegere.</p>
      <p class="mono">Cod rezultat: ${esc(code)}</p>
    </div>
  </section>`;
}
const pct = x => Math.round(Math.max(0, x) * 100);

function optCard(r, i) {
  const good = r.good.map(f => `<li>${esc(cap(f.text))}</li>`);
  if (r.om) good.push(`<li>Acoperă ${r.om === 1 ? "un domeniu de patologie ales" : r.om + " domenii de patologie alese"} de tine</li>`);
  if (r.am) good.push(`<li>Include ${r.am === 1 ? "o competență aleasă" : r.am + " competențe alese"} de tine</li>`);
  if (r.wins) good.push(`<li>Ai ales-o ${r.wins === 1 ? "o dată" : "de " + r.wins + " ori"} în departajarea oarbă</li>`);
  const bad = r.bad.map(f => `<li class="minus">${esc(DIMS.find(d => d[0] === f.k)[1])}: ${r.s.v[f.k]}/4 aici, dar tu ${esc(f.text)}</li>`);
  return `<li class="opt${i === 0 ? " first" : ""}">
    <span class="rank">${i + 1}</span>
    <div class="opt-body">
      <div class="opt-head"><h3>${esc(r.s.n)}</h3><span class="score">${pct(r.fin)}%</span></div>
      <div class="meter"><i style="width:${pct(r.fin)}%"></i></div>
      <p>${esc(r.s.d)}</p>
      <ul class="why">${good.concat(bad).join("")}</ul>
      <p class="meta">Rezidențiat ~${r.s.y} ani</p>
    </div>
  </li>`;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ===================== EVENIMENTE ===================== */
function go(step) { S.step = step; render(); }
function answer(v) {
  S.ans[S.qi] = v;
  if (S.qi < QUESTIONS.length - 1) { S.qi++; render(); } else go("organs");
}
function back() {
  if (S.step === "q") { if (S.qi > 0) S.qi--; render(); }
  else if (S.step === "organs") { S.qi = QUESTIONS.length - 1; go("q"); }
  else if (S.step === "acts") go("organs");
  else if (S.step === "deals") go("acts");
  else if (S.step === "duel") { if (S.di > 0) { S.di--; S.duels.length = S.di; render(); } else go("deals"); }
}

function bind() {
  const $ = id => document.getElementById(id);
  $("startBtn")?.addEventListener("click", () => { S = fresh(); S.step = "q"; history.replaceState(null, "", location.pathname + location.search); render(); });
  $("resumeBtn")?.addEventListener("click", () => { S = loadSaved(); render(); });
  $("backBtn")?.addEventListener("click", back);
  $("restartBtn")?.addEventListener("click", () => { S = fresh(); history.replaceState(null, "", location.pathname + location.search); render(); });
  $("toDeals")?.addEventListener("click", () => go("deals"));

  if (S.step === "q") {
    app.querySelectorAll(".likert button").forEach(b => b.addEventListener("click", () => answer(+b.dataset.v)));
    $("nextBtn")?.addEventListener("click", () => answer(S.ans[S.qi]));
  }
  if (MULTI[S.step]) {
    const kind = S.step;
    app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      const k = kind === "deals" ? +b.dataset.k : b.dataset.k;
      const arr = S[kind], i = arr.indexOf(k);
      i >= 0 ? arr.splice(i, 1) : arr.push(k);
      b.setAttribute("aria-pressed", i < 0);
      $("nextBtn").textContent = arr.length ? "Mai departe →" : "Niciuna, mai departe →";
      if (kind === "deals") $("dealCount").textContent = dealNote();
      save();
    }));
    $("nextBtn").addEventListener("click", () => {
      if (kind === "organs") go("acts");
      else if (kind === "acts") go("deals");
      else {
        if (!rankEligible(S).length) { go("results"); return; }
        S.di = 0; S.duels = []; go("duel");
      }
    });
  }
  if (S.step === "duel") {
    const pairs = duelPairs(rankEligible(S));
    app.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => {
      S.duels[S.di] = +b.dataset.id === pairs[S.di][0] ? 0 : 1;
      S.di++;
      if (S.di >= pairs.length) { setHash(); go("results"); } else render();
    }));
  }
  if (S.step === "results") {
    setHash();
    $("shareBtn")?.addEventListener("click", () => {
      const url = location.href;
      const done = () => { $("toast").textContent = "Link copiat. Trimite-l prietenilor ca să vadă rezultatul tău."; };
      const fallback = () => { const c = $("copybox"); c.hidden = false; c.value = url; c.select(); $("toast").textContent = "Copiază link-ul de mai jos."; };
      try { navigator.clipboard.writeText(url).then(done, fallback); } catch (e) { fallback(); }
    });
  }
}
function setHash() { const h = "#" + encode(S); if (location.hash !== h) history.replaceState(null, "", h); }

document.getElementById("homeBtn").addEventListener("click", () => { S.step = "intro"; history.replaceState(null, "", location.pathname + location.search); render(); });
document.addEventListener("keydown", e => {
  if (S.step === "q" && /^[1-5]$/.test(e.key) && !e.metaKey && !e.ctrlKey) answer(+e.key);
});
function fromHash() {
  const h = location.hash.slice(1);
  const st = h && decode(h);
  if (st) { S = st; render(); return true; }
  return false;
}
window.addEventListener("hashchange", fromHash);
if (!fromHash()) { const sv = loadSaved(); if (sv && sv.step === "results") S = sv; render(); }
</script>
</body>
</html>
