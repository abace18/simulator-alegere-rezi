<style>
/* Layout: o coloană îngustă tip „fișă clinică”; o întrebare pe ecran; rezultatele ca o listă de opțiuni numerotată după rang. */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #12201c;
  --muted: #5a6b66;
  --line: #d3ddd9;
  --accent: #0f6b52;
  --accent-ink: #ffffff;
  --mark: #dcefe7;
  --warn: #a3412a;
  --warn-bg: #f8e9e4;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #151f1c; --ink: #e5eeeb; --muted: #95a8a1; --line: #29372f;
    --accent: #4cc59b; --accent-ink: #062019; --mark: #17372d; --warn: #e48c71; --warn-bg: #33201a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --ink: #e5eeeb; --muted: #95a8a1; --line: #29372f;
  --accent: #4cc59b; --accent-ink: #062019; --mark: #17372d; --warn: #e48c71; --warn-bg: #33201a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.55; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 6vw, 3.1rem); font-weight: 800; font-stretch: 78%; line-height: 1.02; }
h2 { font-size: 1.5rem; font-weight: 700; font-stretch: 85%; line-height: 1.15; }
h3 { font-size: 1.1rem; font-weight: 700; font-stretch: 90%; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-stretch: 85%; font-size: 1.05rem; }
.brand svg { width: 64px; height: 22px; flex: none; }
.brand svg path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen { display: grid; gap: 24px; padding-block: 32px 0; }

/* Intro */
.intro-lead { font-size: 1.1rem; max-width: 60ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.facts div { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.facts b { font-family: var(--font-display); font-size: 1.6rem; font-stretch: 80%; font-weight: 800; }
.facts span { font-size: 0.85rem; color: var(--muted); }
.steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-size: 0.8rem; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center; margin-top: 2px; }
.resume { padding: 14px 16px; border: 1px dashed var(--accent); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Progress */
.progress { display: grid; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.85rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

/* Question */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 22px; display: grid; gap: 24px; }
.qtext { font-family: var(--font-display); font-size: clamp(1.3rem, 4.2vw, 1.75rem); font-weight: 600; font-stretch: 88%; line-height: 1.2; text-wrap: balance; }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.likert button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px 4px; display: grid; gap: 4px; justify-items: center; font-size: 0.78rem; line-height: 1.2; color: var(--muted); min-height: 76px; }
.likert button b { font-family: var(--font-mono); font-size: 1.05rem; color: var(--ink); font-weight: 500; }
.likert button:hover { border-color: var(--accent); }
.likert button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.likert button[aria-pressed="true"] b { color: var(--accent-ink); }
.qnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 0.8rem; color: var(--muted); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-size: 0.92rem; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--mark); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chip.no[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); }

/* Tiebreak */
.duel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.day { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.day:hover { border-color: var(--accent); }
.day .eyebrow { color: var(--accent); }
.day p { font-size: 0.97rem; }

/* Results */
.verdict { display: grid; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--mark); color: var(--ink); width: fit-content; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.pill.close::before { background: var(--warn); }
.opts { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; }
.opt.first { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.rank { font-family: var(--font-display); font-weight: 800; font-stretch: 75%; font-size: 2rem; line-height: 1; color: var(--accent); }
.opt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 500; }
.meter { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-block: 8px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.opt-body { display: grid; gap: 8px; min-width: 0; }
.why { display: grid; gap: 4px; font-size: 0.92rem; margin: 0; padding: 0; list-style: none; }
.why li { padding-left: 18px; position: relative; }
.why li::before { content: "+"; position: absolute; left: 0; font-family: var(--font-mono); color: var(--accent); }
.why li.minus::before { content: "−"; color: var(--warn); }
.meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
.table-wrap { overflow-x: auto; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
td, th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.excluded td { color: var(--muted); }
.profile { display: grid; gap: 8px; margin-top: 12px; }
.prow { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) minmax(0, 11rem); gap: 10px; align-items: center; font-size: 0.82rem; }
.prow span:last-child { text-align: right; }
.ptrack { height: 8px; background: var(--line); border-radius: 4px; position: relative; }
.ptrack i { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.toast { font-size: 0.85rem; color: var(--accent); min-height: 1.2em; }
.note { font-size: 0.9rem; color: var(--muted); display: grid; gap: 8px; border-left: 3px solid var(--line); padding-left: 14px; }
.copybox { width: 100%; font-family: var(--font-mono); font-size: 0.8rem; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }

/* Arbore și ramuri */
.trail { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
.trail li { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.trail li.done { color: var(--accent); border-color: var(--accent); }
.trail li.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.branches { display: grid; gap: 10px; }
.branch { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 4px; }
.branch:hover:not(:disabled) { border-color: var(--accent); }
.branch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--mark); }
.branch:disabled { opacity: 0.5; cursor: not-allowed; }
.branch .meter { margin-block: 4px; }

@media (max-width: 560px) {
  .facts { grid-template-columns: 1fr; }
  .duel { grid-template-columns: 1fr; }
  .likert button { font-size: 0.68rem; padding-inline: 2px; min-height: 70px; }
  .opt { grid-template-columns: 1fr; gap: 6px; }
  .prow { grid-template-columns: 1fr 1fr; }
  .prow .ptrack { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

BRANCHES.forEach(b => {
  b.ids = b.m.split(" ").map(a => ID[a]);
  b.qs = b.q.map(([t, bo]) => { const boost = {}; for (const [a, w] of Object.entries(bo)) { if (ID[a] === undefined) throw new Error("Alias lipsă: " + a); boost[ID[a]] = w; } return { t, boost }; });
});
const BR = k => BRANCHES.find(b => b.k === k);
const BRANCH_BOOST = 0.26;

const LIKERT = [["1","Dezacord total"],["2","Dezacord"],["3","Neutru"],["4","Acord"],["5","Acord total"]];
const N_DUELS = 6;

/* ===================== STARE ===================== */
let S = fresh();
function fresh() { return { step: "intro", qi: 0, ans: Array(QUESTIONS.length).fill(0), deals: [], br: [], bi: 0, bans: [], duels: [], di: 0 }; }
function save() { try { localStorage.setItem("rezi-sim-v3", JSON.stringify(S)); } catch (e) {} }
function loadSaved() { try { const x = JSON.parse(localStorage.getItem("rezi-sim-v3")); if (x && x.ans && x.ans.length === QUESTIONS.length) return x; } catch (e) {} return null; }
function queue(st) { return st.br.flatMap(k => BR(k).qs.map(q => ({ ...q, b: k }))); }

/* ===================== SCOR ===================== */
function profile(ans) {
  const acc = {}, cnt = {};
  DIMS.forEach(([k]) => { acc[k] = 0; cnt[k] = 0; });
  QUESTIONS.forEach((q, i) => {
    if (!ans[i]) return;
    const c = (ans[i] - 3) / 2;
    for (const [k, w] of Object.entries(q.m)) { acc[k] += c * w; cnt[k] += Math.abs(w); }
  });
  const p = {};
  DIMS.forEach(([k]) => {
    const m = cnt[k] ? Math.max(-1, Math.min(1, acc[k] / cnt[k])) : 0;
    p[k] = { pref: 2 + 2 * m, str: Math.abs(m) };
  });
  return p;
}

function scoreAll(st) {
  const p = profile(st.ans);
  // Scor de ramură: media ponderată a acordului pe întrebările care privesc specialitatea (−1…1)
  const bnum = {}, bden = {}, boost = {};
  queue(st).forEach((q, j) => {
    const a = st.bans[j]; if (!a) return;
    const c = (a - 3) / 2;
    for (const [id, w] of Object.entries(q.boost)) { bnum[id] = (bnum[id] || 0) + c * w; bden[id] = (bden[id] || 0) + Math.abs(w); }
  });
  for (const id in bnum) boost[id] = BRANCH_BOOST * bnum[id] / Math.max(1, bden[id]);
  return SPECS.map(s => {
    const ex = st.deals.filter(di => DEALS[di][1](s)).map(di => DEALS[di][2]);
    let num = 0, den = 0;
    const fits = [];
    DIMS.forEach(([k, label, lo, hi]) => {
      const { pref, str } = p[k];
      const w = 0.4 + 2 * str * str + str;
      const gap = Math.abs(pref - s.v[k]);
      num += w * (1 - gap / 4); den += w;
      if (str >= 0.4) fits.push({ k, gap, str, text: pref > 2 ? hi : lo });
    });
    const base = num / den, bst = boost[s.id] || 0;
    return { s, base, bst, raw: base + bst, ex,
      good: fits.filter(f => f.gap <= 1 && Math.abs(s.v[f.k] - MEAN[f.k]) >= 0.9)
        .sort((a, b) => b.str * Math.abs(s.v[b.k] - MEAN[b.k]) - a.str * Math.abs(s.v[a.k] - MEAN[a.k])).slice(0, 3),
      bad: fits.filter(f => f.gap >= 2).sort((a, b) => b.gap * b.str - a.gap * a.str).slice(0, 2) };
  });
}

// Afinitatea fiecărei ramuri = media primelor 3 specialități eligibile din ea, doar pe baza triajului
function branchAffinity(st) {
  const sc = scoreAll({ ...st, br: [], bans: [] });
  return BRANCHES.map(b => {
    const el = b.ids.map(id => sc[id]).filter(r => !r.ex.length).sort((x, y) => y.base - x.base);
    const top = el.slice(0, 3);
    const aff = top.length ? top.reduce((t, r) => t + r.base, 0) / top.length : 0;
    return { b, aff, el };
  }).sort((x, y) => y.aff - x.aff);
}
function defaultBranches(st) {
  const a = branchAffinity(st).filter(x => x.el.length);
  if (!a.length) return [];
  const pick = [a[0].b.k];
  if (a[1] && a[0].aff - a[1].aff <= 0.03) pick.push(a[1].b.k);
  return pick;
}

function rankEligible(st) { return scoreAll(st).filter(r => !r.ex.length).sort((a, b) => b.raw - a.raw); }
function duelPairs(ranked) {
  const t = ranked.slice(0, 4).map(r => r.s.id), pairs = [];
  for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) pairs.push([t[i], t[j]]);
  return pairs;
}
function finalResults(st) {
  const all = scoreAll(st);
  const ok = all.filter(r => !r.ex.length).sort((a, b) => b.raw - a.raw);
  const wins = {};
  duelPairs(ok).forEach(([a, b], i) => {
    if (st.duels[i] === 0) wins[a] = (wins[a] || 0) + 1;
    if (st.duels[i] === 1) wins[b] = (wins[b] || 0) + 1;
  });
  ok.forEach(r => { r.wins = wins[r.s.id] || 0; r.fin = Math.min(0.99, r.raw + 0.03 * r.wins); });
  ok.sort((a, b) => b.fin - a.fin);
  const ex = all.filter(r => r.ex.length).sort((a, b) => b.raw - a.raw);
  return { ok, ex, p: profile(st.ans) };
}

/* ===================== COD DE PARTAJARE ===================== */
// Doar litere, cifre și cratime, ca să treacă prin hash.
function encode(st) {
  const dm = st.deals.reduce((m, i) => m | (1 << i), 0).toString(36);
  return ["t", st.ans.join(""), dm, st.br.join("") || "x", st.bans.join("") || "x", st.duels.join("") || "x"].join("-");
}
function decode(h) {
  const parts = h.split("-");
  if (parts[0] !== "t" || parts.length !== 6 || parts[1].length !== QUESTIONS.length || !/^[1-5]+$/.test(parts[1])) return null;
  const st = fresh();
  st.ans = parts[1].split("").map(Number);
  const dm = parseInt(parts[2], 36) || 0;
  st.deals = DEALS.map((_, i) => i).filter(i => dm & (1 << i));
  st.br = parts[3] === "x" ? [] : [...new Set(parts[3].split(""))].filter(k => BR(k));
  st.bans = parts[4] === "x" ? [] : parts[4].split("").map(Number);
  if (st.bans.length !== queue(st).length || st.bans.some(a => a < 1 || a > 5)) return null;
  st.duels = parts[5] === "x" ? [] : parts[5].split("").map(Number).filter(n => n === 0 || n === 1);
  st.step = "results";
  return st;
}

/* ===================== RANDARE ===================== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function totalSteps(st) { return 1 + QUESTIONS.length + 1 + (st.br.length ? queue(st).length : 20) + N_DUELS; }
function stepIndex(st) {
  const Q = QUESTIONS.length;
  return { deals: 0, q: 1 + st.qi, branch: 1 + Q, bq: 2 + Q + st.bi, duel: 2 + Q + queue(st).length + st.di }[st.step] || 0;
}
function progressBar(label) {
  const pct = Math.round(100 * stepIndex(S) / totalSteps(S));
  return `<div class="progress"><div class="progress-row"><span class="eyebrow">${esc(label)}</span><span class="mono muted">${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function treeTrail(st, current) {
  const lv = [["deals", "Excluderi"], ["q", "Triaj"], ["branch", "Ramură"], ["bq", "Întrebări de ramură"], ["duel", "Departajare"]];
  const order = lv.map(l => l[0]);
  const ci = current === "results" ? lv.length : order.indexOf(current);
  return `<ol class="trail">${lv.map(([k, l], i) => `<li class="${i < ci ? "done" : i === ci ? "now" : ""}">${l}</li>`).join("")}</ol>`;
}

      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Specialitate</th><th>Triaj</th><th>Ramură</th><th>Final</th><th>Ani</th></tr></thead>
        <tbody>${ok.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${esc(r.s.n)}</td><td class="num">${pct(r.base)}%</td><td class="num">${r.bst ? (r.bst > 0 ? "+" : "−") + Math.abs(Math.round(r.bst * 100)) : "·"}</td><td class="num">${pct(r.fin)}%</td><td class="num">${r.s.y}</td></tr>`).join("")}</tbody>
      </table></div>
    </details>

    ${ex.length ? `<details>
      <summary>Eliminate de criteriile tale (${ex.length})</summary>
      <div class="table-wrap"><table class="excluded">
        <thead><tr><th>Specialitate</th><th>Motiv</th><th>Scor fără filtru</th></tr></thead>
        <tbody>${ex.map(r => `<tr><td>${esc(r.s.n)}</td><td>${esc(r.ex.join(", "))}</td><td class="num">${pct(r.raw)}%</td></tr>`).join("")}</tbody>
      </table></div>
    </details>` : ""}

    <div class="note">
      <p><b>Cât de precis e testul?</b> Nicio serie de întrebări nu poate garanta 100% că ai ales corect, pentru că preferințele tale se schimbă cu stagiile și experiența. Ce garantează simulatorul: o specialitate care încalcă un criteriu eliminatoriu ales de tine nu apare niciodată în clasament, iar fiecare scor e explicat de triaj și de răspunsurile din ramură.</p>
      <p>Durata rezidențiatului este orientativă. Verifică durata oficială și numărul de locuri pe rezidentiat.ms.ro înainte de alegere.</p>
      <p class="mono">Cod rezultat: ${esc(encode(S))}</p>
    </div>
  </section>`;
}

function optCard(r, i) {
  const good = r.good.map(f => `<li>${esc(cap(f.text))}</li>`);
  const bad = r.bad.map(f => `<li class="minus">${esc(DIMS.find(d => d[0] === f.k)[1])}: ${r.s.v[f.k]}/4 aici, dar tu ${esc(f.text)}</li>`);
  if (r.bst >= 0.03) good.unshift(`<li>Răspunsurile din ramură o susțin puternic</li>`);
  else if (r.bst >= 0.012) good.unshift(`<li>Răspunsurile din ramură o susțin</li>`);
  else if (r.bst <= -0.015) bad.unshift(`<li class="minus">Răspunsurile din ramură o defavorizează</li>`);
  if (r.wins) good.push(`<li>Ai ales-o ${r.wins === 1 ? "o dată" : "de " + r.wins + " ori"} în departajarea oarbă</li>`);
  return `<li class="opt${i === 0 ? " first" : ""}">
    <span class="rank">${i + 1}</span>
    <div class="opt-body">
      <div class="opt-head"><h3>${esc(r.s.n)}</h3><span class="score">${pct(r.fin)}%</span></div>
      <div class="meter"><i style="width:${pct(r.fin)}%"></i></div>
      <p>${esc(r.s.d)}</p>
      <ul class="why">${good.concat(bad).join("")}</ul>
      <p class="meta">Rezidențiat ~${r.s.y} ani</p>
    </div>
  </li>`;
}

/* ===================== EVENIMENTE ===================== */
function go(step) { S.step = step; render(); }
function startDuels() { if (!rankEligible(S).length) { go("results"); return; } S.di = 0; S.duels = []; go("duel"); }
function answer(v) {
  if (S.step === "q") {
    S.ans[S.qi] = v;
    if (S.qi < QUESTIONS.length - 1) { S.qi++; render(); }
    else { if (!S.br.length) S.br = defaultBranches(S); go("branch"); }
  } else if (S.step === "bq") {
    S.bans[S.bi] = v;
    if (S.bi < queue(S).length - 1) { S.bi++; render(); } else startDuels();
  }
}
function back() {
  if (S.step === "deals") go("intro");
  else if (S.step === "q") { if (S.qi > 0) { S.qi--; render(); } else go("deals"); }
  else if (S.step === "branch") { S.qi = QUESTIONS.length - 1; go("q"); }
  else if (S.step === "bq") { if (S.bi > 0) { S.bi--; render(); } else go("branch"); }
  else if (S.step === "duel") {
    if (S.di > 0) { S.di--; S.duels.length = S.di; render(); }
    else { S.bi = Math.max(0, queue(S).length - 1); go(queue(S).length ? "bq" : "branch"); }
  }
}
function clearHash() { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }

function bind() {
  const $ = id => document.getElementById(id);
  $("startBtn")?.addEventListener("click", () => { S = fresh(); clearHash(); go("deals"); });
  $("resumeBtn")?.addEventListener("click", () => { S = loadSaved(); render(); });
  $("backBtn")?.addEventListener("click", back);
  $("restartBtn")?.addEventListener("click", () => { S = fresh(); clearHash(); render(); });
  $("toDeals")?.addEventListener("click", () => go("deals"));

  if (S.step === "q" || S.step === "bq") {
    app.querySelectorAll(".likert button").forEach(b => b.addEventListener("click", () => answer(+b.dataset.v)));
    $("nextBtn")?.addEventListener("click", () => answer(S.step === "q" ? S.ans[S.qi] : S.bans[S.bi]));
  }
  if (S.step === "deals") {
    app.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      const k = +b.dataset.k, i = S.deals.indexOf(k);
      i >= 0 ? S.deals.splice(i, 1) : S.deals.push(k);
      b.setAttribute("aria-pressed", i < 0);
      $("nextBtn").textContent = S.deals.length ? "Mai departe →" : "Nu exclud nimic →";
      $("dealCount").textContent = dealNote();
      S.br = []; S.bans = []; S.bi = 0;
      save();
    }));
    $("nextBtn").addEventListener("click", () => go("q"));
  }
  if (S.step === "branch") {
    app.querySelectorAll(".branch").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.k, i = S.br.indexOf(k);
      i >= 0 ? S.br.splice(i, 1) : S.br.push(k);
      S.bans = []; S.bi = 0;
      render();
    }));
    $("nextBtn").addEventListener("click", () => { S.bi = Math.min(S.bi, queue(S).length - 1); go("bq"); });
  }
  if (S.step === "duel") {
    const pairs = duelPairs(rankEligible(S));
    app.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => {
      S.duels[S.di] = +b.dataset.id === pairs[S.di][0] ? 0 : 1;
      S.di++;
      if (S.di >= pairs.length) go("results"); else render();
    }));
  }
  if (S.step === "results") {
    setHash();
    $("shareBtn")?.addEventListener("click", () => {
      const url = location.href;
      const done = () => { $("toast").textContent = "Link copiat. Trimite-l prietenilor ca să vadă rezultatul tău."; };
      const fallback = () => { const c = $("copybox"); c.hidden = false; c.value = url; c.select(); $("toast").textContent = "Copiază link-ul de mai jos."; };
      try { navigator.clipboard.writeText(url).then(done, fallback); } catch (e) { fallback(); }
    });
  }
}
function setHash() { const h = "#" + encode(S); if (location.hash !== h) { try { history.replaceState(null, "", h); } catch (e) {} } }

document.getElementById("homeBtn").addEventListener("click", () => { S.step = "intro"; clearHash(); render(); });
document.addEventListener("keydown", e => {
  if ((S.step === "q" || S.step === "bq") && /^[1-5]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) answer(+e.key);
});
function fromHash() {
  const h = location.hash.slice(1);
  const st = h && decode(h);
  if (st) { S = st; render(); return true; }
  return false;
}
window.addEventListener("hashchange", fromHash);
if (!fromHash()) { const sv = loadSaved(); if (sv && sv.step === "results") S = sv; render(); }
</script>
